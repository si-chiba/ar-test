<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>チーバくん AR Pro</title>

    <!-- ローカルのライブラリを使用 -->
    <script src="aframe.min.js"></script>
    <script src="aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }

        /* 起動画面 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4c97ff, #3373cc);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; color: white; text-align: center; padding: 20px; box-sizing: border-box;
        }

        .start-button {
            background-color: #ffab19; color: white; border: none;
            padding: 18px 45px; font-size: 22px; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #cf8b12;
            transition: transform 0.1s; margin-top: 20px;
        }
        .start-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #cf8b12; }

        /* ガイドメッセージ */
        #ui-layer {
            position: fixed; top: 30px; left: 0; width: 100%;
            z-index: 1000; text-align: center; pointer-events: none;
            display: none; transition: opacity 0.5s;
        }
        .guide-text {
            display: inline-block; background: rgba(0,0,0,0.7); color: white;
            padding: 12px 24px; border-radius: 50px; font-size: 14px;
        }

        /* 撮影ボタン */
        #capture-ui {
            position: fixed; bottom: 40px; left: 0; width: 100%;
            display: none; justify-content: center; align-items: center;
            z-index: 1000; pointer-events: none;
        }
        .shutter-btn {
            width: 80px; height: 80px; background: white;
            border: 6px solid #ff4c4c; border-radius: 50%;
            cursor: pointer; pointer-events: auto; outline: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* フラッシュ演出 */
        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10000; pointer-events: none;
        }

        .hide { opacity: 0 !important; }
    </style>
</head>

<body>
    <div id="flash"></div>

    <!-- 1. 起動画面 -->
    <div id="start-screen">
        <h1 style="font-size: 28px;">チーバくん AR Pro</h1>
        <p style="font-size: 16px; opacity: 0.9;">
            「スタート！」を押すとカメラが起動します。<br>
            マーカーを映すとチーバくんが登場するよ！
        </p>
        <button class="start-button" onclick="initSystem()">スタート！</button>
    </div>

    <!-- 2. メッセージレイヤー -->
    <div id="ui-layer">
        <div id="guide-msg" class="guide-text">マーカーをカメラに映してね</div>
    </div>

    <!-- 3. 撮影用UI -->
    <div id="capture-ui">
        <button class="shutter-btn" onclick="takePhoto()"></button>
    </div>

    <div id="ar-container"></div>

    <script>
        function initSystem() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('capture-ui').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'block';

            const container = document.getElementById('ar-container');
            
            // X座標を -0.5 に設定し、左に50cm移動させています
            container.innerHTML = `
                <a-scene embedded 
                    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;" 
                    vr-mode-ui="enabled: false"
                    renderer="preserveDrawingBuffer: true; antialias: true; alpha: true;">
                    
                    <a-assets>
                        <img id="chiba-img" src="chiba-kun.png">
                    </a-assets>

                    <a-marker id="target-marker" type="pattern" url="pattern-marker.patt">
                        <a-image 
                            src="#chiba-img" 
                            width="1" height="1.48"
                            rotation="-90 0 0" 
                            position="-0.5 0.2 0" 
                            scale="6 6 6"
                            animation="property: position; to: -0.5 0.5 0; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
                        </a-image>
                    </a-marker>
                    <a-entity camera></a-entity>
                </a-scene>
            `;

            setupLogic();
        }

        function setupLogic() {
            const marker = document.getElementById('target-marker');
            const uiLayer = document.getElementById('ui-layer');
            const guideMsg = document.getElementById('guide-msg');

            marker.addEventListener('markerFound', () => {
                guideMsg.innerText = "シャッターチャンス！";
                uiLayer.classList.remove('hide');
                setTimeout(() => uiLayer.classList.add('hide'), 3000);
            });
        }

        function takePhoto() {
            const scene = document.querySelector('a-scene');
            const video = document.querySelector('video');
            if (!scene || !video) return;

            // フラッシュ
            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.transition = 'opacity 0.4s'; flash.style.opacity = '0'; }, 100);

            const canvas = scene.canvas;
            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = canvas.width;
            outputCanvas.height = canvas.height;
            const ctx = outputCanvas.getContext('2d');

            // 合成（カメラ映像 + AR）
            ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
            ctx.drawImage(canvas, 0, 0, outputCanvas.width, outputCanvas.height);

            const link = document.createElement('a');
            link.download = `chiba-shot-${Date.now()}.png`;
            link.href = outputCanvas.toDataURL('image/png');
            link.click();
            
            // 再表示
            flash.style.transition = 'none';
        }

        // 画面タップでガイド再表示
        window.addEventListener('click', (e) => {
            if(e.target.className !== 'shutter-btn') {
                const ui = document.getElementById('ui-layer');
                ui.classList.remove('hide');
                setTimeout(() => ui.classList.add('hide'), 2000);
            }
        });
    </script>
</body>
</html>
