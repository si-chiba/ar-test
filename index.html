<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>チーバくん AR Pro (Local JS)</title>

    <!-- あなたの持っているローカルファイルを参照するように戻しました -->
    <script src="aframe.min.js"></script>
    <script src="aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999; color: white; text-align: center;
            padding: 20px; box-sizing: border-box;
        }

        #start-screen { background: linear-gradient(135deg, #4c97ff, #3373cc); }

        #sleep-screen { 
            background: rgba(0, 0, 0, 0.9); 
            display: none; 
            backdrop-filter: blur(8px);
        }

        .btn-ui {
            background-color: #ffab19; color: white; border: none;
            padding: 18px 45px; font-size: 20px; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #cf8b12;
            margin-top: 20px;
        }

        #ui-container {
            position: fixed; bottom: 40px; left: 0; width: 100%;
            display: none; flex-direction: column; align-items: center;
            z-index: 1000; pointer-events: none;
        }

        .capture-button {
            width: 80px; height: 80px; background-color: white;
            border: 6px solid #ff4c4c; border-radius: 50%;
            cursor: pointer; pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .guide-msg {
            margin-bottom: 15px; background: rgba(0,0,0,0.7);
            color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px;
        }

        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10000; pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="flash"></div>

    <!-- 1. 起動画面 -->
    <div id="start-screen" class="overlay">
        <h1 style="font-size: 26px;">チーバくんARカメラ</h1>
        <p>「スタート！」でカメラが動き出すよ</p>
        <button class="btn-ui" onclick="initAR()">スタート！</button>
    </div>

    <!-- 2. スリープ画面 -->
    <div id="sleep-screen" class="overlay">
        <h2 style="color: #ffab19;">カメラを停止しました</h2>
        <p>電池を節約するためにお休み中です</p>
        <button class="btn-ui" onclick="wakeUp()">もう一度起動する</button>
    </div>

    <!-- 3. 撮影用UI -->
    <div id="ui-container">
        <div id="guide-msg" class="guide-msg">マーカーをさがしてね</div>
        <button class="capture-button" onclick="takeSnapshot()"></button>
    </div>

    <div id="ar-container"></div>

    <script>
        let idleTimer;
        const IDLE_LIMIT = 120000; // 2分

        function initAR() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'flex';
            
            const container = document.getElementById('ar-container');
            container.innerHTML = `
                <a-scene embedded 
                    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;" 
                    vr-mode-ui="enabled: false"
                    renderer="preserveDrawingBuffer: true;">
                    
                    <a-assets>
                        <img id="chiba-img" src="chiba-kun.png">
                    </a-assets>

                    <a-marker id="target-marker" type="pattern" url="pattern-marker.patt">
                        <a-image src="#chiba-img" width="1" height="1.48" rotation="-90 0 0" position="0 0.5 0" scale="5 5 5"></a-image>
                    </a-marker>
                    <a-entity camera></a-entity>
                </a-scene>
            `;

            const marker = document.getElementById('target-marker');
            marker.addEventListener('markerFound', () => {
                document.getElementById('guide-msg').innerText = "シャッターチャンス！";
                resetIdleTimer();
            });

            resetIdleTimer();
        }

        function takeSnapshot() {
            resetIdleTimer();
            const scene = document.querySelector('a-scene');
            const video = document.querySelector('video');
            if (!scene || !video) return;

            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; flash.style.transition = 'opacity 0.4s'; }, 100);

            const canvas = scene.canvas;
            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = canvas.width;
            outputCanvas.height = canvas.height;
            const ctx = outputCanvas.getContext('2d');

            ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
            ctx.drawImage(canvas, 0, 0, outputCanvas.width, outputCanvas.height);

            const link = document.createElement('a');
            link.download = `chiba-shot-${Date.now()}.png`;
            link.href = outputCanvas.toDataURL('image/png');
            link.click();
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (document.getElementById('sleep-screen').style.display !== 'flex') {
                idleTimer = setTimeout(enterSleepMode, IDLE_LIMIT);
            }
        }

        function enterSleepMode() {
            const scene = document.querySelector('a-scene');
            if (scene) scene.pause();
            
            const video = document.querySelector('video');
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            document.getElementById('sleep-screen').style.display = 'flex';
            document.getElementById('ui-container').style.display = 'none';
        }

        function wakeUp() {
            location.reload();
        }

        window.addEventListener('touchstart', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);
    </script>
</body>
</html>
