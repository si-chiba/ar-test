<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>チーバくん AR (シンプル版)</title>

    <!-- ローカルのライブラリのみを読み込み -->
    <script src="aframe.min.js"></script>
    <script src="aframe-ar.js"></script>

    <style>
        /* 余白をなくし、スクロールを防止するだけの設定 */
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
</head>

<body>
    <!-- ボタンなどのUIは一切含めず、純粋なAR空間のみを定義 -->
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <a-assets>
            <img id="my-image" src="chiba-kun.png">
        </a-assets>

        <a-marker id="target-marker" type="pattern" url="pattern-marker.patt">
            <!-- 
              positionの最初の数値（X座標）を「-0.5」にすることで、
              カメラから見て中央から左に50cm寄せています。
            -->
            <a-image 
                src="#my-image" 
                width="1" height="1.48"
                rotation="-90 0 0" 
                position="-0.5 0.2 0.5" 
                scale="8 8 8"
                material="transparent: true; alphaTest: 0.5; side: double;">
            </a-image>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
